name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check package metadata and CLI
        run: |
          python -m pip check
          nanopore3 --help

      - name: Check style
        # The repository had 58 lint errors in its own code and never ran this, so
        # the configuration in pyproject was aspirational. Enforced now, on one
        # runner: style does not vary by platform.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          python -m pip install ruff
          python -m ruff check src scripts tests

      - name: Run tests
        run: python -m pytest -q

      - name: Install and test optional MCP adapter
        run: |
          python -m pip install -e ".[mcp]"
          python -m pip check
          python -m pytest tests/test_mcp.py -q

      - name: Compile package
        run: python -m compileall -q src

      - name: Build distributable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist-ci

  installed-wheel:
    name: Linux wheel / report and MCP extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel with optional features
        shell: bash
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist-ci
          wheel=$(find dist-ci -name '*.whl' -print -quit)
          python -m pip install "$wheel[report,mcp]"
          python -m pip check
      - name: Exercise installed assets and stdio from outside the checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nanopore3-smoke"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/mcp_smoke.py" --workspace "$RUNNER_TEMP/nanopore3-smoke" --example
