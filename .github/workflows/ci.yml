name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check package metadata and CLI
        run: |
          python -m pip check
          nanopore3 --help

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile package
        run: python -m compileall -q src

      - name: Build distributable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist-ci
