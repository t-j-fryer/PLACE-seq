schema_version: 1
run_name: 20260506-LAB-BIOTIN-R1-pilot20k
output_root: ../../runs

inputs:
  - path: ../../runs/pilot_inputs/20260506_lab_biotin_byte_sample_20000.fastq
    sample_id: LAB_BIOTIN_R1_DIAGNOSTIC

# These libraries contain designed insert sequences, not whole vectors.  Plate
# routing is mandatory because conserved coding k-mers occur between libraries.
reference_libraries:
  aaseq_biotin:
    fasta: /Users/thomasfryer/Library/CloudStorage/GoogleDrive-tjaf@mit.edu/My Drive/Database/oPool_database/opTF003/01_AAseq_Biotin/01_AAseq_Biotin_references.fasta
    kmer_sizes: [15, 11, 9]
    max_kmer_owners: 10
    candidate_count: 5
    minimum_kmer_score: 2.0
    minimum_identity: 0.80
    minimum_query_coverage: 0.70
    minimum_reference_coverage: 0.70
    minimum_identity_margin: 0.02
  dtf141_dtf142:
    fasta: /Users/thomasfryer/Library/CloudStorage/GoogleDrive-tjaf@mit.edu/My Drive/Database/oPool_database/opTF003/dTF141_dTF142/dTF141_dTF142_references.fasta
    kmer_sizes: [15, 11, 9]
    max_kmer_owners: 10
    candidate_count: 5
    minimum_kmer_score: 2.0
    minimum_identity: 0.80
    minimum_query_coverage: 0.70
    minimum_reference_coverage: 0.70
    minimum_identity_margin: 0.02
  sumo_lab:
    fasta: /Users/thomasfryer/Coding/AI_DBTL_NGS/References/SUMO_LAB/dTF017_dTF018_dTF020_dTF083_dTF084_dTF086_dTF082_dTF023_dTF024_references.fasta
    kmer_sizes: [15, 11, 9]
    max_kmer_owners: 10
    candidate_count: 5
    minimum_kmer_score: 2.0
    minimum_identity: 0.80
    minimum_query_coverage: 0.70
    minimum_reference_coverage: 0.70
    minimum_identity_margin: 0.02

# Inferred from the original 20260506 consensus filenames and demultiplexed
# outputs. RP07 was subsequently confirmed by the experiment owner.
plate_reference_map:
  RP01: aaseq_biotin
  RP02: aaseq_biotin
  RP03: aaseq_biotin
  RP04: aaseq_biotin
  RP05: dtf141_dtf142
  RP06: sumo_lab
  RP07: sumo_lab

library:
  name: pET-amplicon-insert
  # Extended past the ATG through the constant CAGCTT linker, confirmed by the
  # experiment owner as the first 9 bases (ATGCAGCTT) of every construct.  This
  # makes the extracted insert start exactly where the reference FASTAs start;
  # previously every consensus carried a 6-base prefix the references lacked.
  forward_motif: TAAGAAGGAGAGCAGCTATGCAGCTT
  reverse_motif: TCCGAAACACCAGGCACGTC
  # 3 rather than 2: a 26 nt motif at 2 edits is proportionally stricter than
  # the original 20 nt motif was, and costs ~130 assigned reads without it.
  motif_max_edits: 3
  # Conservative gate supplied by the experiment owner to exclude fragments and
  # primer dimers.  It is deliberately wide: on the 20k pilot the assigned reads
  # span 974 nt (p1) to 1,462 nt (p99), so 500-2,000 sits well outside the real
  # distribution.  It removes 5.1% of reads, 86% of which were already failing
  # demultiplexing, and only 0.94% of reads that would otherwise be assigned.
  # The notebook's displayed 1,500-nt minimum would have been far too strict.
  minimum_read_length: 500
  maximum_read_length: 2000
  minimum_mean_quality: 10

barcodes:
  plate:
    registry_csv: ../barcodes/reverse_primer_families.csv
    family_id: rp_amplicon
    trim_bases: 12
    max_edits: 6
    search_window: 400
    search_ends: [head, tail]
    allow_reverse_complement: true
    minimum_margin: 0
    decision_policy: legacy_unique_threshold
  well:
    registry_csv: ../barcodes/well_forward_primers_a1_h12.csv
    family_id: well_forward_full
    trim_bases: 12
    max_edits: 7
    search_window: 400
    search_ends: [head]
    allow_reverse_complement: false
    minimum_margin: 0
    decision_policy: legacy_unique_best

parallel:
  # See the production profile for the measurement.  Process workers cost about
  # one second each to start, so a short pilot favours fewer workers than a
  # full run does; 8 is used here to match production behaviour.
  backend: process
  jobs: 8
  threads_per_job: 1
  chunk_reads: 1000

random_seed: 141142

consensus:
  # Cross-platform default. Change explicitly to mafft_spoa only when both tools
  # are available; the selected backend is recorded in every consensus row.
  backend: portable
  minimum_depth: 6
  maximum_reads: 30
  minimum_support: 0.60

qc:
  minimum_identity: 0.98
  minimum_query_coverage: 0.95
  minimum_reference_coverage: 0.95
  length_tolerance: 10
  # Coding QC.  forward_motif now runs through the constant ATGCAGCTT, so the
  # consensus is the bare insert and the full reading frame is
  # ATGCAGCTT + consensus + the constant region 3' of the insert.
  # `upstream_constant` must begin at the start codon and must cover exactly the
  # coding sequence between it and where forward_motif ends; both constants are
  # required together, because a frame assumed rather than declared would make
  # the stop-codon check meaningless.  Revisit these whenever a motif changes:
  # shortening forward_motif back to ...AGCTATG would make this ATG alone.
  upstream_constant: ATGCAGCTT
  downstream_constant: 

# Culture-plate provenance.  RP01-RP05 are not compressed: each is a single
# culture plate, and the pilot confirms each carries its whole library rather
# than one block (RP01-RP04 show 18-20 of the 20 aaseq_biotin blocks; RP05 shows
# all 6 dtf141 blocks).  Only RP06 and RP07 stack three culture plates each,
# holding sumo_lab blocks 1-3, 4-6 and 7-10, so only they need the gene identity
# to recover which culture plate a read came from.
compressed_pcr:
  enabled: true
  pcr_plates:
    RP01: [CP_RP01]
    RP02: [CP_RP02]
    RP03: [CP_RP03]
    RP04: [CP_RP04]
    RP05: [CP_RP05]
    RP06: [CP_RP06_B1_3, CP_RP06_B4_6, CP_RP06_B7_10]
    RP07: [CP_RP07_B1_3, CP_RP07_B4_6, CP_RP07_B7_10]
  clonality:
    # Scraped with a multichannel over an agar plate: diversity per well is
    # inconsistent, so no expectation is declared.
    RP06: unspecified
    # Monoclonal picks mixed and grown together, one clone per block, giving
    # 3 + 3 + 4 = 10 distinct genes per well.
    RP07: per_block
  blocks:
    aaseq_biotin:
      "1": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "2": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "3": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "4": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "5": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "6": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "7": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "8": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "9": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "10": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "11": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "12": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "13": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "14": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "15": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "16": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
      "17": [CP_RP01, CP_RP02, CP_RP03, CP_RP04]
