# Whole plasmids were supplied as GenBank; the references here are the region
# between the two motifs, which is what the pipeline compares against.  All 54
# are distinct, a whole number of codons, and free of internal stops.
# 8 of the 62 supplied plasmids lack one or both motifs and are excluded:
# 3-pCT-ALFA-ALFA, VNP6-NbALFA-mNG2, VNP6-antiALFA-mNG, VNP6-antiSUMO-1-mNG,
# VNP6-antiSUMO-4-mNG, pTF733_pCT-SUMO, pTF734_pCT-ALFA, pTF735_pCT-ALFA-ALFA.
reference_libraries:
  gg_hifi:
    fasta: ../../runs/refs_20260818/insert_references.fasta
    kmer_sizes: [15, 11, 9]
    max_kmer_owners: 10
    candidate_count: 5
    minimum_kmer_score: 2.0
    minimum_identity: 0.80
    minimum_query_coverage: 0.70
    minimum_reference_coverage: 0.70
    minimum_identity_margin: 0.02

# TF544/547 are plate 1 rounds 1 and 2; TF545/546 are plate 2 rounds 1 and 2.
# All four amplify the same library, so every plate barcode routes to it.
plate_reference_map:
  RP01: gg_hifi
  RP02: gg_hifi
  RP03: gg_hifi
  RP04: gg_hifi

library:
  name: gg-hifi-insert
  forward_motif: TAAGAAGGAGAGCAGCTATGCAGCTT
  reverse_motif: TCGGGCGGATCCCATCACCACCACCATCACTAA
  motif_max_edits: 3
  # Reads are bimodal: a junk peak below 1 kb and the real amplicon peaking at
  # 3.0-3.5 kb with a tail past 8 kb.  The gate is deliberately wide because
  # motif extraction, not length, is what selects usable reads.
  minimum_read_length: 1000
  maximum_read_length: 8000
  minimum_mean_quality: 10
  allow_empty_reads: true

barcodes:
  plate:
    registry_csv: ../barcodes/reverse_primer_families.csv
    # Only the four TF primers actually used, registered as their own family so
    # a read cannot be called as an unused RP05-RP12.
    family_id: tf544_547_core
    # The registered sequence is the 24 nt variable core, so nothing is trimmed.
    trim_bases: 0
    # The four cores are >=12 edits apart, so 5 stays unambiguous.
    max_edits: 5
    search_window: 400
    search_ends: [head, tail]
    allow_reverse_complement: true
    minimum_margin: 0
    decision_policy: legacy_unique_threshold
  well:
    registry_csv: ../barcodes/well_forward_primers_a1_h12.csv
    family_id: well_forward_full
    trim_bases: 12
    max_edits: 7
    search_window: 400
    search_ends: [head]
    allow_reverse_complement: false
    minimum_margin: 0
    decision_policy: legacy_unique_best

parallel:
  backend: process
  jobs: 8
  threads_per_job: 1
  chunk_reads: 1000

random_seed: 141142

consensus:
  backend: portable
  minimum_depth: 6
  maximum_reads: 30
  minimum_support: 0.60

qc:
  minimum_identity: 0.98
  minimum_query_coverage: 0.95
  minimum_reference_coverage: 0.95
  length_tolerance: 10
  # forward_motif runs through the constant ATGCAGCTT, so the consensus is the
  # bare insert and the frame is ATGCAGCTT + consensus + the 3' motif, which is
  # itself the GS linker, His tag and stop.
  upstream_constant: ATGCAGCTT
  downstream_constant: TCGGGCGGATCCCATCACCACCACCATCACTAA
