schema_version: 1
run_name: 260608-SUMO-LAB-BS-FS-Ph
output_root: ../../runs

inputs:
  - path: /Volumes/TJAF/260608_SUMO_LAB_BS_FS_Ph/AI_DBTL.fastq
    sample_id: AI_DBTL

# Six designed libraries on two different constructs.  The 5' motif is shared,
# but sensors and ebm_ab end at a different constant region, so they carry
# per-library reverse_motif and QC frame overrides.  SUMO and EBM each arrived as
# one A+B file; the halves are separate sub-libraries with independent block
# numbering and keep their A|/B| prefix so their blocks stay distinct.
reference_libraries:
  opTF001:
    fasta: ../../runs/refs_260608/opTF001.fasta
    kmer_sizes: [15, 11, 9]
    max_kmer_owners: 10
    candidate_count: 5
    minimum_kmer_score: 2.0
    minimum_identity: 0.80
    minimum_query_coverage: 0.70
    minimum_reference_coverage: 0.70
    minimum_identity_margin: 0.02
  sumo_ab:
    fasta: ../../runs/refs_260608/sumo_ab.fasta
    kmer_sizes: [15, 11, 9]
    max_kmer_owners: 10
    candidate_count: 5
    minimum_kmer_score: 2.0
    minimum_identity: 0.80
    minimum_query_coverage: 0.70
    minimum_reference_coverage: 0.70
    minimum_identity_margin: 0.02
  lab:
    fasta: ../../runs/refs_260608/lab.fasta
    kmer_sizes: [15, 11, 9]
    max_kmer_owners: 10
    candidate_count: 5
    minimum_kmer_score: 2.0
    minimum_identity: 0.80
    minimum_query_coverage: 0.70
    minimum_reference_coverage: 0.70
    minimum_identity_margin: 0.02
  dtf141_dtf142:
    fasta: ../../runs/refs_260608/dtf141_dtf142.fasta
    kmer_sizes: [15, 11, 9]
    max_kmer_owners: 10
    candidate_count: 5
    minimum_kmer_score: 2.0
    minimum_identity: 0.80
    minimum_query_coverage: 0.70
    minimum_reference_coverage: 0.70
    minimum_identity_margin: 0.02
  sensors:
    fasta: ../../runs/refs_260608/sensors.fasta
    kmer_sizes: [15, 11, 9]
    max_kmer_owners: 10
    candidate_count: 5
    minimum_kmer_score: 2.0
    minimum_identity: 0.80
    minimum_query_coverage: 0.70
    minimum_reference_coverage: 0.70
    minimum_identity_margin: 0.02
    reverse_motif: TCGGGCGGATCCCATCACCACCACCATCACTAATGAC
    qc_upstream_constant: ATGCAGCTT
    qc_downstream_constant: TCGGGCGGATCCCATCACCACCACCATCACTAA
  ebm_ab:
    fasta: ../../runs/refs_260608/ebm_ab.fasta
    kmer_sizes: [15, 11, 9]
    max_kmer_owners: 10
    candidate_count: 5
    minimum_kmer_score: 2.0
    minimum_identity: 0.80
    minimum_query_coverage: 0.70
    minimum_reference_coverage: 0.70
    minimum_identity_margin: 0.02
    reverse_motif: TCGGGCGGATCCCATCACCACCACCATCACTAATGAC
    qc_upstream_constant: ATGCAGCTT
    qc_downstream_constant: TCGGGCGGATCCCATCACCACCACCATCACTAA

# Confirmed empirically against the reads, not assumed: each barcode's reads
# assign to the library below at 65-94%.  RP12 is the only unused barcode and is
# deliberately left unmapped so it stays a negative control.
plate_reference_map:
  RP01: opTF001
  RP02: opTF001
  RP03: opTF001
  RP04: opTF001
  RP05: sumo_ab
  RP06: sumo_ab
  RP07: sumo_ab
  RP08: lab
  RP09: sensors
  RP10: ebm_ab
  RP11: dtf141_dtf142

library:
  name: rp-amplicon-insert
  forward_motif: TAAGAAGGAGAGCAGCTATGCAGCTT
  reverse_motif: TCCGAAACACCAGGCACGTC
  motif_max_edits: 3
  # Read lengths: p1=66, median=1302, p95=2646, p99=3807. This keeps 92.4%.
  minimum_read_length: 500
  maximum_read_length: 3000
  minimum_mean_quality: 10
  allow_empty_reads: true

barcodes:
  plate:
    registry_csv: ../barcodes/reverse_primer_families.csv
    family_id: rp_amplicon
    trim_bases: 12
    # Swept 2-8 against the RP12 negative control: specificity is flat across
    # the range, so 6 maximises yield (87.3% assigned) at no cost in precision.
    max_edits: 6
    search_window: 400
    search_ends: [head, tail]
    allow_reverse_complement: true
    minimum_margin: 0
    decision_policy: legacy_unique_threshold
  well:
    registry_csv: ../barcodes/well_forward_primers_a1_h12.csv
    family_id: well_forward_full
    trim_bases: 12
    max_edits: 7
    search_window: 400
    search_ends: [head]
    allow_reverse_complement: false
    minimum_margin: 0
    decision_policy: legacy_unique_best

parallel:
  backend: process
  jobs: 8
  threads_per_job: 1
  chunk_reads: 1000

random_seed: 141142

consensus:
  backend: portable
  minimum_depth: 6
  maximum_reads: 30
  minimum_support: 0.60

qc:
  minimum_identity: 0.98
  minimum_query_coverage: 0.95
  minimum_reference_coverage: 0.95
  length_tolerance: 10
  upstream_constant: ATGCAGCTT
  downstream_constant: 

# RP05 pools 22 culture plates (11 SUMO A + 11 SUMO B); RP08 pools 11 LAB plates.
# A culture plate's wells each hold one block but different wells hold different
# blocks, so block identity names the plate.  Clonality is left unspecified: a
# well receives one clone per pooled culture plate, not one per block, so the
# per_block derivation would not describe this layout.
compressed_pcr:
  enabled: true
  block_pattern: "^((?:[AB]\\|)?Block_\\d+)_"
  pcr_plates:
    RP05: [SUMO_A_P1, SUMO_A_P2, SUMO_A_P3, SUMO_A_P4, SUMO_A_P5, SUMO_A_P6, SUMO_A_P7, SUMO_A_P8, SUMO_A_P9, SUMO_A_P10, SUMO_A_P11, SUMO_B_P1, SUMO_B_P2, SUMO_B_P3, SUMO_B_P4, SUMO_B_P5, SUMO_B_P6, SUMO_B_P7, SUMO_B_P8, SUMO_B_P9, SUMO_B_P10, SUMO_B_P11]
    RP08: [LAB_P1, LAB_P2, LAB_P3, LAB_P4, LAB_P5, LAB_P6, LAB_P7, LAB_P8, LAB_P9, LAB_P10, LAB_P11]
  clonality:
    RP05: unspecified
    RP08: unspecified
  blocks:
    sumo_ab:
      "A|Block_1": [SUMO_A_P1]
      "A|Block_2": [SUMO_A_P2]
      "A|Block_3": [SUMO_A_P3]
      "A|Block_4": [SUMO_A_P4]
      "A|Block_5": [SUMO_A_P5]
      "A|Block_6": [SUMO_A_P6]
      "A|Block_8": [SUMO_A_P6]
      "A|Block_18": [SUMO_A_P6]
      "A|Block_9": [SUMO_A_P7]
      "A|Block_10": [SUMO_A_P7]
      "A|Block_11": [SUMO_A_P8]
      "A|Block_12": [SUMO_A_P8]
      "A|Block_13": [SUMO_A_P9]
      "A|Block_14": [SUMO_A_P9]
      "A|Block_15": [SUMO_A_P10]
      "A|Block_16": [SUMO_A_P10]
      "A|Block_17": [SUMO_A_P11]
      "A|Block_7": [SUMO_A_P11]
      "B|Block_1": [SUMO_B_P1]
      "B|Block_2": [SUMO_B_P2]
      "B|Block_3": [SUMO_B_P3]
      "B|Block_4": [SUMO_B_P4]
      "B|Block_5": [SUMO_B_P5]
      "B|Block_6": [SUMO_B_P6]
      "B|Block_8": [SUMO_B_P6]
      "B|Block_18": [SUMO_B_P6]
      "B|Block_9": [SUMO_B_P7]
      "B|Block_10": [SUMO_B_P7]
      "B|Block_11": [SUMO_B_P8]
      "B|Block_12": [SUMO_B_P8]
      "B|Block_13": [SUMO_B_P9]
      "B|Block_14": [SUMO_B_P9]
      "B|Block_15": [SUMO_B_P10]
      "B|Block_16": [SUMO_B_P10]
      "B|Block_17": [SUMO_B_P11]
      "B|Block_7": [SUMO_B_P11]
    lab:
      "Block_1": [LAB_P1]
