[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanopore3"
version = "0.1.0"
description = "A portable, reproducible pipeline for demultiplexing and consensus analysis of Nanopore amplicons"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
  { name = "Nanopore3 contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "edlib>=1.3.9.post1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
report = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.11,<2",
]
notebook = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.2,<5",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
nanopore3 = "nanopore3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nanopore3 = ["example_data/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
