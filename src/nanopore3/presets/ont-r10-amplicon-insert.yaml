# As ont-r10-amplicon, but for a library whose references are the designed insert
# only, so acceptance floors are already measured over the designed sequence and
# the amplicon is not reconstructed.
#
# Named separately rather than as a flag because the two differ in what a threshold
# is measured over, which is the one thing that must never be inherited by accident.

library:
  motif_max_edits: 3
  minimum_mean_quality: 10
  allow_empty_reads: true

parallel:
  backend: process
  threads_per_job: 1
  chunk_reads: 1000

consensus:
  backend: portable
  minimum_depth: 6
  maximum_reads: 300
  minimum_support: 0.60
  minimum_base_quality: 10
  significance: 0.05
  minimum_minor_fraction: 0.20

qc:
  minimum_identity: 0.98
  minimum_query_coverage: 0.95
  minimum_reference_coverage: 0.95
  length_tolerance: 10

chimera:
  enabled: true
  window: 90
  step: 45
  exclude_reads: written
